version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: flipkart_genius_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: flipkart_genius_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=30d
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: flipkart_genius_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
